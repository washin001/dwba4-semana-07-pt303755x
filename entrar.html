<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Entrar - IFSP - Pirituba</title>

    <link rel="shortcut icon" href="Imagens/favicon.ico" type="image/x-icon">

    <script src="js/disabling.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header id="cabecalho">
    <nav>
        <object width="100%" height="200px" data="menu.html"></object>
    </nav>
</header>

<main class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white text-center">
                    <h1 class="h3 mb-0">Entrar</h1>
                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <label for="entrar-usuario" class="form-label">
                                Usuário
                            </label>

                            <input
                                type="text"
                                name="usuario"
                                id="entrar-usuario"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="entrar-senha" class="form-label">
                                Senha
                            </label>

                            <input
                                type="password"
                                name="senha"
                                id="entrar-senha"
                                class="form-control"
                                required>
                        </div>

                        <div class="d-grid gap-2">

                            <input
                                type="submit"
                                value="Entrar"
                                class="btn btn-success">

                            <a href="#" class="text-center">
                                Esqueci a senha
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

<footer>
    <object width="100%" height="200px" data="rodape.html"></object>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
